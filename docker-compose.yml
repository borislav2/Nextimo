services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextimo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: nextimo
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nextimo:${POSTGRES_PASSWORD:-change-me}@db:5432/nextimo?schema=public
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
